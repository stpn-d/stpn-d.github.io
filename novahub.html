<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f5f5f7">
    
    <title>NovaHub</title>
    
    <style>
        :root {
            --bg-color: #f5f5f7;
            --text-color: #1d1d1f;
            --accent-color: #007aff;
            --card-bg: #ffffff;
            --danger: #ff3b30;
            --nav-bg: rgba(255, 255, 255, 0.85);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px 100px; /* Spodní padding kvůli navigaci */
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        /* Taby / Sekce */
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Společné prvky pro vstupy */
        input[type="text"], input[type="number"], textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            margin-bottom: 20px;
            background: var(--card-bg);
            box-shadow: 0 4px 14px rgba(0,0,0,0.04);
            outline: none;
            font-family: inherit;
        }

        textarea {
            height: 300px;
            resize: none;
            line-height: 1.5;
        }

        /* Seznamy */
        ul { list-style: none; padding: 0; margin: 0; }
        
        li {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        li.packed { opacity: 0.5; }
        li.packed .item-text { text-decoration: line-through; }

        .checkbox {
            width: 22px; height: 22px;
            border: 2px solid var(--accent-color);
            border-radius: 50%;
            margin-right: 16px;
            flex-shrink: 0;
        }
        li.packed .checkbox { background: var(--accent-color); }

        .item-text { font-size: 17px; flex-grow: 1; }
        
        .expense-amount {
            font-weight: 600;
            color: var(--danger);
            margin-right: 12px;
        }

        .delete-btn {
            color: var(--danger);
            font-weight: 600;
            background: none;
            border: none;
            padding: 8px;
            cursor: pointer;
        }

        .total-box {
            background: var(--accent-color);
            color: white;
            padding: 16px;
            border-radius: 14px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 24px;
            box-shadow: 0 4px 14px rgba(0, 122, 255, 0.3);
        }

        /* Spodní navigace */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
            border-top: 1px solid rgba(0,0,0,0.1);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #8e8e93;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-item.active { color: var(--accent-color); }
        .nav-icon { font-size: 24px; margin-bottom: 4px; filter: grayscale(100%); opacity: 0.5; }
        .nav-item.active .nav-icon { filter: grayscale(0%); opacity: 1; }

        /* Expense Input Row */
        .expense-inputs { display: flex; gap: 10px; }
        .expense-inputs input[type="text"] { flex-grow: 1; }
        .expense-inputs input[type="number"] { width: 100px; }

    </style>
</head>
<body>

    <div class="container">
        
        <!-- MODULE 1: SEZNAM -->
        <div id="tab-tasks" class="tab-content active">
            <h1>Seznam 🧳</h1>
            <input type="text" id="taskInput" placeholder="Co přidáme?" onkeypress="handleTaskPress(event)">
            <ul id="taskList"></ul>
        </div>

        <!-- MODULE 2: POZNÁMKY -->
        <div id="tab-notes" class="tab-content">
            <h1>Poznámky 📝</h1>
            <textarea id="noteInput" placeholder="Zapiš si myšlenky sem... Automaticky se ukládají." oninput="saveNotes()"></textarea>
        </div>

        <!-- MODULE 3: VÝDAJE -->
        <div id="tab-expenses" class="tab-content">
            <h1>Výdaje 💸</h1>
            <div class="total-box">Celkem: <span id="totalExpense">0</span> Kč</div>
            <div class="expense-inputs">
                <input type="text" id="expName" placeholder="Za co?">
                <input type="number" id="expAmount" placeholder="Kč" onkeypress="handleExpensePress(event)">
            </div>
            <ul id="expenseList"></ul>
        </div>

    </div>

    <!-- SPODNÍ NAVIGACE -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('tasks', this)">
            <div class="nav-icon">🧳</div>
            <span>Seznam</span>
        </div>
        <div class="nav-item" onclick="switchTab('notes', this)">
            <div class="nav-icon">📝</div>
            <span>Poznámky</span>
        </div>
        <div class="nav-item" onclick="switchTab('expenses', this)">
            <div class="nav-icon">💸</div>
            <span>Výdaje</span>
        </div>
    </nav>

    <script>
        // --- NAVIGACE ---
        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            
            document.getElementById('tab-' + tabId).classList.add('active');
            element.classList.add('active');
        }

        // --- 1. SEZNAM (TASKS) ---
        const taskInput = document.getElementById('taskInput');
        const taskList = document.getElementById('taskList');
        let tasks = JSON.parse(localStorage.getItem('novahub-tasks')) || [];

        function renderTasks() {
            taskList.innerHTML = '';
            tasks.forEach((task, index) => {
                const li = document.createElement('li');
                if (task.packed) li.classList.add('packed');
                li.innerHTML = `
                    <div class="checkbox"></div>
                    <span class="item-text">${task.name}</span>
                    <button class="delete-btn" onclick="deleteTask(event, ${index})">✕</button>
                `;
                li.onclick = () => toggleTask(index);
                taskList.appendChild(li);
            });
            localStorage.setItem('novahub-tasks', JSON.stringify(tasks));
        }

        function handleTaskPress(e) {
            if (e.key === 'Enter' && taskInput.value.trim() !== '') {
                tasks.unshift({ name: taskInput.value.trim(), packed: false });
                taskInput.value = '';
                renderTasks();
            }
        }

        function toggleTask(index) {
            tasks[index].packed = !tasks[index].packed;
            tasks.sort((a, b) => a.packed === b.packed ? 0 : a.packed ? 1 : -1);
            renderTasks();
        }

        function deleteTask(e, index) {
            e.stopPropagation();
            tasks.splice(index, 1);
            renderTasks();
        }

        // --- 2. POZNÁMKY ---
        const noteInput = document.getElementById('noteInput');
        noteInput.value = localStorage.getItem('novahub-notes') || '';
        
        function saveNotes() {
            localStorage.setItem('novahub-notes', noteInput.value);
        }

        // --- 3. VÝDAJE ---
        const expName = document.getElementById('expName');
        const expAmount = document.getElementById('expAmount');
        const expenseList = document.getElementById('expenseList');
        const totalExpenseEl = document.getElementById('totalExpense');
        let expenses = JSON.parse(localStorage.getItem('novahub-expenses')) || [];

        function renderExpenses() {
            expenseList.innerHTML = '';
            let total = 0;
            expenses.forEach((exp, index) => {
                total += exp.amount;
                const li = document.createElement('li');
                li.innerHTML = `
                    <span class="item-text">${exp.name}</span>
                    <span class="expense-amount">${exp.amount} Kč</span>
                    <button class="delete-btn" onclick="deleteExpense(${index})">✕</button>
                `;
                expenseList.appendChild(li);
            });
            totalExpenseEl.innerText = total;
            localStorage.setItem('novahub-expenses', JSON.stringify(expenses));
        }

        function handleExpensePress(e) {
            if (e.key === 'Enter' && expName.value.trim() !== '' && expAmount.value !== '') {
                expenses.unshift({ 
                    name: expName.value.trim(), 
                    amount: parseFloat(expAmount.value) 
                });
                expName.value = '';
                expAmount.value = '';
                expName.focus();
                renderExpenses();
            }
        }

        function deleteExpense(index) {
            expenses.splice(index, 1);
            renderExpenses();
        }

        // --- INICIALIZACE ---
        renderTasks();
        renderExpenses();
    </script>
</body>
</html>
